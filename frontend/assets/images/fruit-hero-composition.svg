<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" fill="none">
  <defs>
    <!-- Smooth curved background blob gradient -->
    <linearGradient id="mintBackdrop" x1="120" y1="40" x2="550" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="50%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Deep realistic soft drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#064E3B" flood-opacity="0.18" />
    </filter>

    <filter id="ambientShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Glossy Tomato Shading -->
    <radialGradient id="glossyTomato" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFA4A4" />
      <stop offset="15%" stop-color="#FF5252" />
      <stop offset="55%" stop-color="#DC2626" />
      <stop offset="85%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#550A0A" />
    </radialGradient>

    <!-- Glossy Orange Shading -->
    <radialGradient id="glossyOrange" cx="30%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="25%" stop-color="#FB923C" />
      <stop offset="65%" stop-color="#EA580C" />
      <stop offset="90%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#5B1C05" />
    </radialGradient>

    <!-- Banana Shading -->
    <linearGradient id="glossyBanana" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>

    <!-- Rich Leaf Shading -->
    <linearGradient id="leafGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- Large organic background curve -->
  <path d="M140 180C90 70 240 30 380 40C520 50 610 110 615 240C620 370 510 440 370 450C210 460 160 380 115 320C75 270 70 215 140 180Z" fill="url(#mintBackdrop)" />

  <!-- Background Leaves -->
  <g filter="url(#softShadow)" opacity="0.95">
    <!-- Top Right Leaf -->
    <path d="M460 70C510 40 560 70 570 120C540 145 480 130 460 70Z" fill="url(#leafGrad)" />
    <path d="M465 75C510 95 545 110 565 118" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" />

    <!-- Top Left Leaf -->
    <path d="M210 130C165 95 180 50 225 40C240 75 235 120 210 130Z" fill="url(#leafGrad)" />
    <path d="M215 125C220 90 225 65 224 45" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- BANANAS BUNCH (Back Layer) -->
  <g filter="url(#softShadow)">
    <!-- Banana 1 (Rear) -->
    <path d="M380 110C440 95 500 130 535 185C560 230 565 290 540 340C520 310 495 245 465 200C430 155 395 135 380 110Z" fill="url(#glossyBanana)" stroke="#854D0E" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="380" cy="110" r="6" fill="#3B1C06" />

    <!-- Banana 2 (Middle) -->
    <path d="M355 135C415 120 475 155 510 210C535 255 540 315 515 365C495 330 475 265 445 220C410 175 375 155 355 135Z" fill="url(#glossyBanana)" stroke="#854D0E" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="355" cy="135" r="6" fill="#3B1C06" />

    <!-- Banana 3 (Front of bunch) -->
    <path d="M330 160C390 145 450 180 485 235C510 280 515 340 490 390C470 350 450 285 420 240C385 195 350 175 330 160Z" fill="url(#glossyBanana)" stroke="#854D0E" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="330" cy="160" r="6" fill="#3B1C06" />

    <!-- Banana Highlights -->
    <path d="M375 155C415 175 450 220 475 270" stroke="#FEF9C3" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- ORANGES (Center & Right Foreground) -->
  <g filter="url(#softShadow)">
    <!-- Main Big Orange -->
    <circle cx="365" cy="340" r="72" fill="url(#glossyOrange)" />
    <!-- Citrus highlight specular -->
    <ellipse cx="340" cy="310" rx="42" ry="26" fill="#FFFFFF" opacity="0.32" />
    <ellipse cx="335" cy="305" rx="20" ry="12" fill="#FFFFFF" opacity="0.45" />

    <!-- Calyx Stem on Orange -->
    <circle cx="365" cy="272" r="5" fill="#15803D" />
    <path d="M361 272L365 263L369 272Z" fill="#15803D" />
  </g>

  <!-- TOMATOES (Cluster on the Left Foreground) -->
  <g filter="url(#softShadow)">
    <!-- Tomato 1 (Rear Left) -->
    <circle cx="230" cy="245" r="58" fill="url(#glossyTomato)" />
    <ellipse cx="210" cy="222" rx="32" ry="18" fill="#FFFFFF" opacity="0.35" />
    <!-- Calyx 1 -->
    <path d="M230 190L222 178M230 190L238 178M230 190L218 192M230 190L242 192M230 190L225 200M230 190L235 200" stroke="#15803D" stroke-width="4" stroke-linecap="round" />
    <path d="M230 190L230 176" stroke="#14532D" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tomato 2 (Main Center Front - Biggest) -->
    <circle cx="295" cy="320" r="66" fill="url(#glossyTomato)" />
    <!-- Specular gloss highlights -->
    <ellipse cx="270" cy="290" rx="36" ry="20" fill="#FFFFFF" opacity="0.42" />
    <ellipse cx="265" cy="285" rx="18" ry="9" fill="#FFFFFF" opacity="0.55" />
    <!-- Sepals / Green Star Calyx -->
    <path d="M295 258L282 242M295 258L308 242M295 258L276 260M295 258L314 260M295 258L285 272M295 258L305 272" stroke="#15803D" stroke-width="5" stroke-linecap="round" />
    <path d="M295 258L295 238" stroke="#14532D" stroke-width="5" stroke-linecap="round" />

    <!-- Tomato 3 (Front Lower Left) -->
    <circle cx="195" cy="345" r="48" fill="url(#glossyTomato)" />
    <ellipse cx="180" cy="322" rx="26" ry="14" fill="#FFFFFF" opacity="0.38" />
    <path d="M195 300L188 288M195 300L202 288M195 300L182 301M195 300L208 301" stroke="#15803D" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Foreground Fresh Leaves -->
  <g filter="url(#softShadow)">
    <!-- Center front leaf -->
    <path d="M310 395C365 412 410 385 435 350C400 355 345 360 310 395Z" fill="url(#leafGrad)" />
    <path d="M315 393C355 385 395 372 430 355" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left front leaf -->
    <path d="M140 375C120 410 155 440 200 430C190 395 165 380 140 375Z" fill="url(#leafGrad)" />
    <path d="M145 380C165 400 185 415 198 426" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
