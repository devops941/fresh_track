<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="wShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#wShadow)">
    <!-- Base Platform -->
    <rect x="20" y="115" width="200" height="8" rx="3" fill="#1e293b"/>

    <!-- Left Storage Rack -->
    <rect x="30" y="30" width="55" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="30" y1="58" x2="85" y2="58" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="30" y1="86" x2="85" y2="86" stroke="#38bdf8" stroke-opacity="0.3"/>
    <!-- Crates (Tomatoes) -->
    <rect x="36" y="38" width="18" height="15" rx="2" fill="#ef4444" fill-opacity="0.85"/>
    <rect x="58" y="38" width="20" height="15" rx="2" fill="#ef4444" fill-opacity="0.85"/>
    <rect x="36" y="66" width="20" height="15" rx="2" fill="#ef4444" fill-opacity="0.85"/>
    <rect x="60" y="66" width="18" height="15" rx="2" fill="#22c55e" fill-opacity="0.85"/>
    <rect x="36" y="94" width="42" height="16" rx="2" fill="#334155"/>

    <!-- Center Cold Air Unit (Chiller) -->
    <rect x="95" y="20" width="50" height="25" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Snowflake / Cold Fan -->
    <circle cx="120" cy="32" r="7" fill="#0284c7" fill-opacity="0.4"/>
    <path d="M 120,27 L 120,37 M 115,32 L 125,32 M 117,29 L 123,35 M 117,35 L 123,29" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Cold Wind Waves -->
    <path d="M 112,50 Q 116,56 120,50 Q 124,56 128,50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 108,62 Q 114,68 120,62 Q 126,68 132,62" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 104,74 Q 112,80 120,74 Q 128,80 136,74" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Right Storage Rack -->
    <rect x="155" y="30" width="55" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="155" y1="58" x2="210" y2="58" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="155" y1="86" x2="210" y2="86" stroke="#38bdf8" stroke-opacity="0.3"/>
    <!-- Crates (Oranges & Bananas) -->
    <rect x="162" y="38" width="20" height="15" rx="2" fill="#f97316" fill-opacity="0.85"/>
    <rect x="186" y="38" width="18" height="15" rx="2" fill="#f97316" fill-opacity="0.85"/>
    <rect x="162" y="66" width="18" height="15" rx="2" fill="#eab308" fill-opacity="0.85"/>
    <rect x="184" y="66" width="20" height="15" rx="2" fill="#eab308" fill-opacity="0.85"/>
    <rect x="162" y="94" width="42" height="16" rx="2" fill="#334155"/>

    <!-- IoT Sensor Antenna Center -->
    <line x1="120" y1="90" x2="120" y2="115" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="120" cy="88" r="3" fill="#10b981"/>
    <path d="M 114,84 Q 120,80 126,84" stroke="#10b981" stroke-width="1" fill="none"/>
    <path d="M 111,80 Q 120,74 129,80" stroke="#10b981" stroke-width="0.8" fill="none"/>
  </g>
</svg>