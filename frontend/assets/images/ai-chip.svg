<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#chipGlow)">
    <!-- Outer Chip Pins -->
    <!-- Top Pins -->
    <rect x="52" y="16" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="66" y="16" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="80" y="16" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="94" y="16" width="6" height="8" fill="#38bdf8" rx="1"/>
    <!-- Bottom Pins -->
    <rect x="52" y="96" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="66" y="96" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="80" y="96" width="6" height="8" fill="#38bdf8" rx="1"/>
    <rect x="94" y="96" width="6" height="8" fill="#38bdf8" rx="1"/>

    <!-- Left Pins -->
    <rect x="28" y="38" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="28" y="52" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="28" y="66" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="28" y="80" width="8" height="6" fill="#10b981" rx="1"/>
    <!-- Right Pins -->
    <rect x="116" y="38" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="116" y="52" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="116" y="66" width="8" height="6" fill="#10b981" rx="1"/>
    <rect x="116" y="80" width="8" height="6" fill="#10b981" rx="1"/>

    <!-- Main Chip Board -->
    <rect x="36" y="24" width="80" height="72" rx="10" fill="url(#chipGrad)" stroke="#10b981" stroke-width="1.5"/>

    <!-- Brain / Neural Network Nodes -->
    <circle cx="60" cy="50" r="3" fill="#34d399"/>
    <circle cx="92" cy="50" r="3" fill="#34d399"/>
    <circle cx="76" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="60" cy="70" r="3" fill="#38bdf8"/>
    <circle cx="92" cy="70" r="3" fill="#38bdf8"/>
    <circle cx="76" cy="60" r="4.5" fill="#10b981"/>

    <!-- Connecting Circuit Lines -->
    <line x1="60" y1="50" x2="76" y2="40" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="92" y1="50" x2="76" y2="40" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="60" y1="50" x2="76" y2="60" stroke="#10b981" stroke-width="1.2"/>
    <line x1="92" y1="50" x2="76" y2="60" stroke="#10b981" stroke-width="1.2"/>
    <line x1="60" y1="70" x2="76" y2="60" stroke="#38bdf8" stroke-width="1"/>
    <line x1="92" y1="70" x2="76" y2="60" stroke="#38bdf8" stroke-width="1"/>

    <!-- Chip Label -->
    <text x="76" y="86" fill="#f8fafc" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="0.5">RANDOM FOREST</text>
  </g>
</svg>