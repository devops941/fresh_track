<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="tomatoGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="tomatoGlow" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Main Tomato Body -->
    <path d="M 60,32 C 40,30 22,44 20,65 C 18,84 32,102 52,104 C 57,104.5 63,104.5 68,104 C 88,102 102,84 100,65 C 98,44 80,30 60,32 Z" fill="url(#tomatoGrad)"/>
    <!-- Specular Highlight -->
    <ellipse cx="44" cy="48" rx="16" ry="10" transform="rotate(-20 44 48)" fill="url(#tomatoGlow)"/>
    <ellipse cx="36" cy="42" rx="4" ry="2.5" fill="#ffffff" opacity="0.8"/>
    
    <!-- Leaves / Calyx -->
    <!-- Center Stem -->
    <path d="M 60,34 Q 61,16 68,14 Q 65,22 61,34 Z" fill="#15803d"/>
    <!-- Star Leaves -->
    <path d="M 60,34 Q 45,26 34,28 Q 44,35 58,35 Z" fill="url(#leafGrad)"/>
    <path d="M 60,34 Q 75,26 86,28 Q 76,35 62,35 Z" fill="url(#leafGrad)"/>
    <path d="M 60,34 Q 68,44 76,50 Q 68,46 61,36 Z" fill="url(#leafGrad)"/>
    <path d="M 60,34 Q 52,44 44,50 Q 52,46 59,36 Z" fill="url(#leafGrad)"/>
    <path d="M 60,34 Q 60,20 54,16 Q 58,24 60,34 Z" fill="url(#leafGrad)"/>
  </g>
</svg>