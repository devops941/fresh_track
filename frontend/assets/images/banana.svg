<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="15%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bananaBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="bananaShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bananaShadow)">
    <!-- Back Banana -->
    <path d="M 28,32 C 34,22 44,24 55,30 C 78,44 88,72 80,95 C 75,93 68,88 64,80 C 68,60 58,40 32,32 Z" fill="url(#bananaBackGrad)" opacity="0.85"/>
    <!-- Stem tip back -->
    <path d="M 28,32 L 23,30 L 25,36 Z" fill="#4d7c0f"/>

    <!-- Front Banana -->
    <path d="M 32,38 C 42,28 62,34 76,46 C 96,64 100,88 88,102 C 86,104 82,104 80,100 C 88,84 80,62 62,48 C 50,38 38,38 32,38 Z" fill="url(#bananaGrad)"/>
    <!-- Curve Highlight -->
    <path d="M 44,38 C 58,44 74,56 82,74" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Stem & Tip -->
    <path d="M 32,38 L 26,35 L 28,42 Z" fill="#65a30d"/>
    <path d="M 88,102 L 91,105 L 87,106 Z" fill="#78350f"/>
  </g>
</svg>