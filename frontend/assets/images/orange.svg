<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="orangeGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="32%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="orangeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#orangeShadow)">
    <!-- Orange Sphere -->
    <circle cx="60" cy="65" r="42" fill="url(#orangeGrad)"/>
    <!-- Highlight shine -->
    <ellipse cx="46" cy="48" rx="16" ry="11" transform="rotate(-25 46 48)" fill="url(#orangeGlow)"/>
    <ellipse cx="40" cy="42" rx="4" ry="2.5" fill="#ffffff" opacity="0.8"/>
    
    <!-- Peel Texture Dots -->
    <circle cx="75" cy="55" r="1" fill="#c2410c" opacity="0.6"/>
    <circle cx="82" cy="68" r="1.2" fill="#c2410c" opacity="0.5"/>
    <circle cx="70" cy="80" r="1.1" fill="#c2410c" opacity="0.5"/>
    <circle cx="50" cy="88" r="1.2" fill="#c2410c" opacity="0.5"/>
    <circle cx="34" cy="74" r="1" fill="#c2410c" opacity="0.5"/>

    <!-- Stem & Leaf -->
    <path d="M 60,25 Q 61,16 66,13 Q 63,20 60,25 Z" fill="#854d0e"/>
    <path d="M 60,24 C 64,12 80,12 85,20 C 76,28 65,26 60,24 Z" fill="url(#orangeLeafGrad)"/>
    <!-- Leaf Vein -->
    <path d="M 60,24 Q 72,18 84,20" stroke="#166534" stroke-width="0.8" fill="none"/>
  </g>
</svg>