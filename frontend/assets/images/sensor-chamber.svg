<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="chmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <!-- Chamber Box -->
    <rect x="25" y="20" width="110" height="80" rx="12" fill="url(#chmGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="30" y="25" width="100" height="70" rx="8" fill="#0b132b" fill-opacity="0.7"/>

    <!-- Sensor 1: Thermometer -->
    <g transform="translate(40, 36)">
      <rect x="3" y="2" width="4" height="24" rx="2" fill="#334155"/>
      <rect x="4" y="10" width="2" height="16" rx="1" fill="#ef4444"/>
      <circle cx="5" cy="28" r="4.5" fill="#ef4444"/>
      <text x="14" y="22" fill="#f8fafc" font-size="8" font-family="sans-serif" font-weight="bold">23°C</text>
    </g>

    <!-- Sensor 2: Humidity Droplet -->
    <g transform="translate(90, 36)">
      <path d="M 6,5 C 6,5 11,14 11,18 C 11,21.5 8.5,24 5.5,24 C 2.5,24 0,21.5 0,18 C 0,14 5,5 5,5 Z" fill="#38bdf8"/>
      <text x="16" y="22" fill="#f8fafc" font-size="8" font-family="sans-serif" font-weight="bold">90%</text>
    </g>

    <!-- Divider Line -->
    <line x1="35" y1="65" x2="125" y2="65" stroke="#334155" stroke-dasharray="3,3"/>

    <!-- Sensor 3: Light (Sun/Bulb) -->
    <g transform="translate(40, 72)">
      <circle cx="6" cy="10" r="4" fill="#fbbf24"/>
      <path d="M 6,2 L 6,4 M 6,16 L 6,18 M 0,10 L 2,10 M 10,10 L 12,10" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="14" y="14" fill="#f8fafc" font-size="8" font-family="sans-serif">10 Lux</text>
    </g>

    <!-- Sensor 4: CO2 Gas -->
    <g transform="translate(90, 72)">
      <circle cx="6" cy="10" r="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="3.5" y="13" fill="#10b981" font-size="6" font-family="sans-serif" font-weight="bold">CO₂</text>
      <text x="16" y="14" fill="#f8fafc" font-size="8" font-family="sans-serif">340 ppm</text>
    </g>

    <!-- Status Pulse Beacon -->
    <circle cx="125" cy="30" r="3" fill="#10b981"/>
    <circle cx="125" cy="30" r="6" fill="#10b981" fill-opacity="0.3"/>
  </g>
</svg>